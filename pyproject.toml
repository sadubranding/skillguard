[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillguard"
version = "0.1.0"
description = "Static quality, structure, and security checks for Agent Skills"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = ["typer>=0.12,<1.0", "PyYAML>=6.0,<7.0", "rich>=13.7,<15.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.5,<1.0"]

[project.scripts]
skillguard = "skillguard.cli:main"

[tool.setuptools.packages.find]
include = ["skillguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
